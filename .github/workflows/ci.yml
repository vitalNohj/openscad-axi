name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # Unit and CLI tests run without OpenSCAD; integration tests skip themselves.
      - run: npm test
      # Fails when skill/SKILL.md has drifted from the CLI's own strings.
      - run: npm run check-skill
      # Fails when README.md's command table has drifted from command help.
      - run: npm run check-readme
